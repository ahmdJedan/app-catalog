<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Offline - Katalog Aplikasi DSTI UNDIP</title>
  <style>
    :root {
      --color-navy: #0f294a;
      --color-accent: #1d4ed8;
      --color-bg: #f8fafc;
      --color-text: #0f172a;
      --color-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(15, 41, 74, 0.08);
    }
    .icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #eff6ff;
      color: var(--color-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-navy);
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: var(--color-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: var(--color-navy);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #18365d;
    }
    .brand {
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap" aria-hidden="true">📡</div>
    <h1>Koneksi Terputus (Offline)</h1>
    <p>
      Anda sedang tidak terhubung ke jaringan internet. Halaman yang belum tersimpan dalam cache sementara tidak dapat diakses.
    </p>
    <button class="btn" onclick="window.location.reload()">Coba Muat Ulang</button>
    <div class="brand">Direktorat Sistem dan Teknologi Informasi &middot; UNDIP</div>
  </div>
</body>
</html>
